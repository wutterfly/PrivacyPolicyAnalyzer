[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "privacy-policy-analyzer"
version = "0.2.3"
description = "Tools to crawl, analyze and report on website privacy policies using NLP models and rule-based patterns."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["privacy", "nlp", "crawler", "privacy-policy", "classification"]
requires-python = ">=3.12"
dependencies = [
    # ML/Analysis
    "torch>=2.10.0",
    "transformers>=5.0.0",
    "datasets>=4.5.0",
    "huggingface-hub",
    "numpy",
    "accelerate",
    "scikit-learn",
    "protobuf",
    "sentencepiece",

    # Crawler
    "beautifulsoup4>=4.14.3",
    "playwright>=1.58.0",
    "requests>=2.32.0",
    "html5lib",
    "langdetect",

    # Visualization
    "matplotlib",
    "pandas>=2.3.0",
]


[project.optional-dependencies]
gpu = ["bitsandbytes"]   # only pulled when someone wants GPU quantization


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
