[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "privacy-policy-analyzer"
version = "0.3.0"
description = "Tools to crawl, analyze and report on website privacy policies using NLP models and rule-based patterns."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["privacy", "nlp", "crawler", "privacy-policy", "classification"]
requires-python = ">=3.12"
dependencies = [
    # ML/Analysis
    "torch>=2.10.0",
    "transformers<5.0.0",
    #"transformers>=5.0.0", # update when optimum[onnxruntime], more specifically optimum-onnx supports transformers>=5.0.0
    "huggingface-hub[hf_xet]",
    "numpy",
    "protobuf",
    "sentencepiece",

    # Crawler
    "beautifulsoup4>=4.14.3",
    "playwright>=1.58.0",
    "requests>=2.32.0",
    "html5lib",
    "langdetect",

    # Visualization
    "matplotlib",
    "pandas>=3.0.0",
]


[project.optional-dependencies]
# only pulled in for fine-tuning models (src/privacy_policy_analyzer/training) -
# not required for crawling/analyzing policies with the default pipeline
training = ["datasets>=4.5.0", "scikit-learn", "accelerate", "bitsandbytes"]
onnx = ["optimum[onnxruntime]>=2.0.0"]   # only pulled when someone wants ONNX Runtime inference


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
